name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
          curl -L -o www/adhan.min.js https://cdn.jsdelivr.net/npm/adhan@4.4.6/lib/bundles/adhan.umd.min.js
          ls -la www/

      - name: Prepare assets folder
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          mkdir -p assets/splash
          cp icon.png assets/splash/splash.png
          ls -la assets/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx @capacitor/assets generate --android || echo "Asset generation skipped"

      - name: Sync web assets
        run: npx cap sync android

      - name: Copy Adhan sounds to Android raw resources
        run: |
          RAW_DIR="android/app/src/main/res/raw"
          mkdir -p "$RAW_DIR"
          # الأسماء: بالحروف الصغيرة فقط بدون شرطات
          if [ -f sounds/adhan1.mp3 ]; then
            cp sounds/adhan1.mp3 "$RAW_DIR/adhan1.mp3"
            echo "✓ adhan1.mp3 copied"
          fi
          if [ -f sounds/adhan2.mp3 ]; then
            cp sounds/adhan2.mp3 "$RAW_DIR/adhan2.mp3"
            echo "✓ adhan2.mp3 copied"
          fi
          if [ -f sounds/adhan_fajr.mp3 ]; then
            cp sounds/adhan_fajr.mp3 "$RAW_DIR/adhan_fajr.mp3"
            echo "✓ adhan_fajr.mp3 copied"
          fi
          echo "=== Raw folder contents ==="
          ls -la "$RAW_DIR/"

      - name: Add Android permissions to manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' "$MANIFEST"
            echo "=== Manifest permissions ==="
            grep "uses-permission" "$MANIFEST" || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakina-apk
          path: android/app/build/outputs/apk/debug/*.apk
